name: Releases
# ينشر كل إصدار بـ releases/versions.json (إذا ما منشور بعد): يبني ملف التثبيت من نفس الكود مالته ويرفعه مع البصمة
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          items='[]'
          if [ "$HAS_KEY" != "true" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "::warning::ما موجود RELEASE_TOKEN بإعدادات المستودع — النشر متوقف. أضفه ثم شغّل Run workflow."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; echo "count=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          while read -r row; do
            v=$(echo "$row" | jq -r .version)
            if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$v منشور مسبقاً"
            else
              echo "v$v راح ينبني وينشر"
              items=$(echo "$items" | jq -c --argjson r "$row" '. + [$r]')
            fi
          done < <(jq -c '.[]' releases/versions.json)
          echo "matrix=$(echo "$items" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$items" | jq length)" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: meta
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "NSIS_PATH=C:\Program Files (x86)\NSIS\makensis.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        working-directory: app
        run: |
          npm ci || npm install
          npm run dist
          ls -la dist/*.exe
      - name: Release notes
        run: |
          v='${{ matrix.version }}'
          f="app/dist/IBRA-CLEAN-UP-Setup-$v.exe"
          sha=$(sha256sum "$f" | cut -d' ' -f1)
          size=$(du -m "$f" | cut -f1)
          {
            cat "meta/releases/notes/$v.md"
            echo
            echo "**الملف:** \`IBRA-CLEAN-UP-Setup-$v.exe\` — ${size} MB — ويندوز 10/11 (64-bit)"
            echo
            echo "**SHA-256:** \`$sha\`"
            echo
            echo "برمجة وتطوير ابراهيم الخزرجي — https://ibraprogram.netlify.app/"
          } > body.md
          cat body.md
      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-CLEAN-UP-Setup-${{ matrix.version }}
          path: app/dist/IBRA-CLEAN-UP-Setup-${{ matrix.version }}.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}
          target_commitish: ${{ matrix.commit }}
          name: IBRA CLEAN UP ${{ matrix.version }}
          body_path: body.md
          files: app/dist/IBRA-CLEAN-UP-Setup-${{ matrix.version }}.exe
          make_latest: ${{ matrix.latest && 'true' || 'false' }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
